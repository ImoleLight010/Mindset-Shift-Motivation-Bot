name: Mindset Shift posts

on:
  schedule:
    - cron: "7 6 * * *"
    - cron: "7 11 * * *"
    - cron: "7 15 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning | afternoon | wisdom | evening"
        required: true
        default: "morning"

permissions:
  contents: write

concurrency:
  group: mindset-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Pick slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "7 6 * * *")  echo "name=morning" >> $GITHUB_OUTPUT ;;
              "7 11 * * *") echo "name=afternoon" >> $GITHUB_OUTPUT ;;
              "7 15 * * *") echo "name=wisdom" >> $GITHUB_OUTPUT ;;
              "7 19 * * *") echo "name=evening" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Generate and send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py "${{ steps.slot.outputs.name }}"

      - name: Save history (prevents repeats)
        run: |
          git config user.name "mindset-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "Update history" && git pull --rebase && git push)
