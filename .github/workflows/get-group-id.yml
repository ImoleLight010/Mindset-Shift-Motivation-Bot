name: Get Telegram Group ID

on:
  workflow_dispatch:

jobs:
  get-group-id:
    runs-on: ubuntu-latest
    steps:
      - name: Get group ID
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = json.load(response)
              if not data.get("ok"):
                  print("Telegram API returned an error.")
              else:
                  chats = {}
                  for update in data.get("result", []):
                      msg = update.get("message") or update.get("channel_post") or update.get("edited_message")
                      if msg:
                          chat = msg.get("chat", {})
                          if chat.get("type") in ("group", "supergroup"):
                              chats[chat.get("id")] = chat.get("title", "Unnamed group")
                  if chats:
                      for chat_id, title in chats.items():
                          print(f"Group: {title} | Chat ID: {chat_id}")
                  else:
                      print("No group messages found. Send a new message in your group and run this workflow again.")
          except Exception:
              print("Could not retrieve updates. Check the bot token and try again.")
          PY
