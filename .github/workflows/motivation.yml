name: Mindset Shift Motivation Bot

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send Mindset Shift message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}

        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          event = os.environ.get("EVENT_NAME", "")

          if not token or not chat_id:
              print("ERROR: A required GitHub secret is missing.")
              raise SystemExit(1)

          utc_hour = datetime.now(timezone.utc).hour

          messages = {
              6: """🌅 GOOD MORNING, MINDSET SHIFTERS!

          Every new day brings another opportunity to learn, grow, and become better.

          🎯 TODAY'S CHALLENGE:
          What positive action will you take today?

          Better Thinking. Broader Understanding. Practical Growth. 🚀""",

              11: """☀️ AFTERNOON MINDSET CHALLENGE!

          Knowing what to do is important. Taking action makes the difference.

          🎯 Identify one thing you have postponed and take the first step today.

          💬 DISCUSSION:
          What prevents people from acting on what they know?""",

              15: """🧠 WISDOM OF THE DAY

          📖 BIBLE — Proverbs 4:7
          "Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding."

          ☪️ QURAN — Surah Az-Zumar 39:9
          أَمَّنْ هُوَ قَانِتٌ آنَاءَ اللَّيْلِ سَاجِدًا وَقَائِمًا
          Meaning: Is one who is devoutly obedient during the night, prostrating and standing...

          🔬 SCIENCE:
          Learning and practice help us develop skills.

          💭 PHILOSOPHY:
          Question your assumptions and examine your reasons.

          🎯 QUESTION:
          What idea has challenged your thinking recently?""",

              19: """🌙 EVENING REFLECTION — MINDSET SHIFTERS

          Before today ends, reflect:

          ✅ What did you learn?
          ✅ What did you do well?
          ✅ What can you improve tomorrow?

          Growth requires reflection, honesty, and a willingness to improve.

          💬 What lesson will you carry into tomorrow?

          Keep learning and growing! 💚"""
          }

          if event == "workflow_dispatch":
              message = """🤖 MINDSET SHIFT BOT — TEST MESSAGE!

          Your automated motivation bot is being tested.

          🌱 Keep learning.
          💡 Keep thinking.
          🚀 Keep growing.

          Better Thinking. Broader Understanding. Practical Growth. 🎉"""
          else:
              message = messages.get(utc_hour)

          if not message:
              print("No message scheduled for this UTC hour.")
              raise SystemExit(0)

          payload = json.dumps({
              "chat_id": chat_id,
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)

              if result.get("ok"):
                  print("SUCCESS: Telegram message sent!")
              else:
                  print("Telegram rejected the message:")
                  print(result.get("description", "Unknown error"))
                  raise SystemExit(1)

          except urllib.error.HTTPError as error:
              print(f"Telegram HTTP error: {error.code}")
              try:
                  details = json.loads(error.read().decode("utf-8"))
                  print("Telegram response:", details.get("description", details))
              except Exception:
                  print("Could not read Telegram's error details.")
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("Connection error:", error.reason)
              raise SystemExit(1)

          PY
